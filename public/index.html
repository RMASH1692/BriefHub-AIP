<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Information Hub</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #fff; }
        h2 { text-align: center; font-weight: normal; border-bottom: 2px solid #0078D4; padding-bottom: 15px; margin-bottom: 20px; letter-spacing: 1px; color: #0078D4; }
        .search-container { display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 30px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        
        button { padding: 10px 20px; font-size: 16px; background-color: #0078D4; color: white; border: none; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        button:hover { background-color: #005a9e; }
        .btn-pdf { background-color: #28a745; text-decoration: none; display: inline-block; color: white; border-radius: 4px; padding: 10px 20px; font-size: 15px; font-weight: bold; }
        .btn-pdf:hover { background-color: #218838; }
        
        .card { border-left: 4px solid #0078D4; border: 1px solid #eee; border-left-width: 4px; padding: 15px 20px; margin-bottom: 15px; border-radius: 4px; background: #fff; display: flex; justify-content: space-between; align-items: center; transition: box-shadow 0.2s; }
        .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h3 { margin: 0; font-size: 18px; color: #0078D4; font-weight: normal; }
        
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .nr-tag { font-size: 22px; font-weight: bold; color: #333; letter-spacing: 1px; }
        
        .breadcrumb { margin-bottom: 20px; font-size: 14px; color: #666; }
        .breadcrumb span { cursor: pointer; color: #0078D4; text-decoration: underline; }
    </style>
</head>
<body>

    <h2>航空情報 (AIC / AIP SUP)</h2>

    <div class="search-container" id="nav-container"></div>
    
    <div id="breadcrumb-container" class="breadcrumb"></div>
    <div id="result-container"></div>

    <script>
        let fullData = {};
        let state = { view: 'home', category: '', date: '' };

        async function init() {
            try {
                const res = await fetch('data.json');
                fullData = await res.json();
                render();
            } catch (e) {
                document.getElementById('result-container').innerHTML = '<p style="text-align:center; color:red;">データの読み込みに失敗しました。</p>';
            }
        }

        function render() {
            const nav = document.getElementById('nav-container');
            const res = document.getElementById('result-container');
            const bread = document.getElementById('breadcrumb-container');
            
            nav.innerHTML = '';
            res.innerHTML = '';
            bread.innerHTML = '';

            if (state.view === 'home') {
                nav.innerHTML = `
                    <button onclick="setView('category', 'AIC')">AIC を表示</button>
                    <button onclick="setView('category', 'AIP SUP')">AIP SUP を表示</button>
                `;
            } else if (state.view === 'category') {
                bread.innerHTML = `<span onclick="setView('home')">TOP</span> > ${state.category}`;
                const dates = Object.keys(fullData[state.category] || {}).sort().reverse();
                
                res.innerHTML = `<div style="background:#fff; padding:20px; border:1px solid #eee; border-radius:4px;"><h3 style="margin-top:0; color:#0078D4;">発行日を選択してください</h3><div id="date-list"></div></div>`;
                const list = res.querySelector('#date-list');
                dates.forEach(d => {
                    list.innerHTML += `
                        <div class="list-row">
                            <span style="font-size:16px; font-weight:bold;">${d}</span>
                            <button onclick="setView('list', '${state.category}', '${d}')">一覧を表示</button>
                        </div>`;
                });
            } else if (state.view === 'list') {
                bread.innerHTML = `<span onclick="setView('home')">TOP</span> > <span onclick="setView('category', '${state.category}')">${state.category}</span> > ${state.date}`;
                const items = fullData[state.category][state.date];

                items.forEach(item => {
                    res.innerHTML += `
                        <div class="card">
                            <div class="nr-tag">NR ${item.nr}</div>
                            <a href="${item.path}" target="_blank" class="btn-pdf">閲覧 (PDF)</a>
                        </div>`;
                });
            }
        }

        function setView(v, cat = '', date = '') {
            state = { view: v, category: cat, date: date };
            render();
        }

        init();
    </script>
</body>
</html>
