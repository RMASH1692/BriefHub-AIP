name: Process PDFs and Deploy

on:
  push:
    paths:
      - 'raw_data/**'
      - 'scripts/**'
      - 'public/index.html'
    branches:
      - main
  workflow_dispatch: # 手動実行ボタンを有効化（テスト用）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v3からv4へ更新

      - name: Set up Python
        uses: actions/setup-python@v5 # v4からv5へ更新
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process PDFs
        run: python scripts/process_pdfs.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v2 # v1からv2へ更新
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: your-project-name # ここを実際のPagesプロジェクト名に変更
          directory: public
