name: Process PDFs and Deploy

on:
  push:
    paths:
      - 'raw_data/**'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf
      - run: python scripts/process_pdfs.py
      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: briefhub-aip
          directory: public
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1 # v2ではなくv1を指定
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: briefhub-aip
          directory: public
